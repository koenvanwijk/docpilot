name: Build and deploy DocPilot
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Expand initial source archive (first run only)
        if: ${{ hashFiles('bootstrap/*.txt') != '' }}
        shell: bash
        run: |
          cat bootstrap/part*.txt | base64 --decode | tar -xzf -
          rm -rf bootstrap
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "Add DocPilot application source"
          git push origin HEAD:main
      - name: Run tests
        run: node --test
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./public
      - id: deployment
        uses: actions/deploy-pages@v4
